{% extends "base.html" %}

{% block main %}
<h1>Suppression de l'auteur {{ selectedAuteur.Nom }}. Êtes-vous sûr ?</h1>

<form method="POST" action="{{ url_for('auteurs.eraseAuteur') }}">
    {{ deleteForm.hidden_tag() }}
    {{ deleteForm.Nom.label }}
    {{ deleteForm.Nom(size=50, disabled=True, class_="form-control mb-3") }}
    <input class="btn btn-danger" type="submit" value="Confirmer">
    <a href="{{ url_for('auteurs.getAuteurs') }}" class="btn btn-secondary">Retour</a>
</form>
{% endblock %}
